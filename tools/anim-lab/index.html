<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>出手预览 · 还没进局</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #14110c;
        --panel: #1c1812;
        --ink: #f4ead4;
        --muted: #9a8b72;
        --gold: #c9a46a;
        --line: #3a3428;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      }
      body { display: flex; min-height: 100%; }
      #stage {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1a140e;
      }
      canvas { display: block; border-radius: 8px; }
      aside {
        width: 320px;
        padding: 16px 16px 24px;
        background: var(--panel);
        border-left: 1px solid var(--line);
        overflow: auto;
      }
      h1 { font-size: 16px; margin: 0 0 4px; color: var(--gold); }
      .sub { color: var(--muted); margin: 0 0 16px; font-size: 12px; }
      h2 { font-size: 12px; color: var(--muted); margin: 16px 0 8px; font-weight: 600; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; }
      button {
        appearance: none;
        border: 1px solid var(--line);
        background: #2a2218;
        color: var(--ink);
        border-radius: 8px;
        padding: 6px 10px;
        cursor: pointer;
      }
      button:hover { border-color: var(--gold); }
      button.on { background: #3d3220; border-color: var(--gold); color: var(--gold); }
      #hit {
        width: 100%;
        margin-top: 8px;
        padding: 12px;
        font-size: 16px;
        font-weight: 700;
        color: var(--gold);
        border-color: var(--gold);
      }
      label.chk { display: flex; align-items: center; gap: 8px; margin: 10px 0; color: var(--ink); }
      #now { margin-top: 12px; color: var(--gold); font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="view"></canvas></div>
    <aside>
      <h1>出手预览</h1>
      <p class="sub">先看挥得像不像。满意了再说进战斗。</p>
      <h2>人</h2>
      <div class="row" id="heroes"></div>
      <h2>手上</h2>
      <div class="row" id="hands"></div>
      <h2>穿 / 背</h2>
      <div class="row" id="worn"></div>
      <h2>朝哪打</h2>
      <div class="row" id="face"></div>
      <label class="chk"><input id="auto" type="checkbox" checked /> 自己接着挥</label>
      <button id="hit" type="button">挥一下</button>
      <div id="now"></div>
    </aside>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
